<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 휴대폰 화면 폭에 맞춰 보이도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나초보 포트폴리오</title>
  <style>
    /* ===== 색상 변수 (라이트 모드 기본값) ===== */
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5c6370;
      --line: #e3e6ea;
      --accent: #2f6fed;
      --tag-now-bg: #e8f0fe;
      --tag-now-text: #1d4fbf;
      --tag-next-bg: #f1f2f4;
      --tag-next-text: #4a505a;
    }

    /* ===== 다크 모드: 기기 설정을 따라감 ===== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1c1f24;
        --text: #e8eaed;
        --muted: #a0a6b0;
        --line: #2c3037;
        --accent: #7aa5ff;
        --tag-now-bg: #1f3054;
        --tag-now-text: #b9cdff;
        --tag-next-bg: #2a2e35;
        --tag-next-text: #c3c8d0;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      /* 외부 폰트 없이 기기 기본 한글 폰트 사용 */
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.7;
      /* 한글이 단어 중간에서 끊기지 않게 + 긴 영어/URL은 줄바꿈 허용 */
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 16px 40px;
    }

    /* ===== 1) 인사 영역 ===== */
    .hero {
      padding: 24px 0 40px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 32px;
    }
    .hero .hello {
      color: var(--accent);
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .hero h1 {
      /* 화면 크기에 따라 글자 크기 자동 조절 (최소 2rem ~ 최대 3.2rem) */
      font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .hero .intro {
      font-size: clamp(1.1rem, 4.5vw, 1.4rem);
      color: var(--muted);
    }

    /* ===== 공통 섹션 카드 ===== */
    section.card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px 20px;
      margin-bottom: 20px;
    }
    section.card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
    }
    .group-title {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
      margin: 4px 0 10px;
    }
    .group + .group { margin-top: 20px; }

    /* ===== 2) 기술 태그 ===== */
    .tags {
      list-style: none;
      display: flex;
      flex-wrap: wrap;   /* 좁은 화면에서는 자동으로 다음 줄로 */
      gap: 8px;
    }
    .tags li {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.92rem;
    }
    .tags.now li  { background: var(--tag-now-bg);  color: var(--tag-now-text); }
    .tags.next li { background: var(--tag-next-bg); color: var(--tag-next-text); }

    /* ===== 3) 목표 ===== */
    .goal p + p { margin-top: 6px; }
    .goal strong { color: var(--accent); }

    /* ===== 4) 연락처 ===== */
    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    .github-link:hover,
    .github-link:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }
    .github-link svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 32px;
    }

    /* ===== 아주 좁은 화면(320px 내외) 보정 ===== */
    @media (max-width: 360px) {
      .container { padding-top: 40px; }
      section.card { padding: 20px 16px; }
      .tags li { font-size: 0.85rem; padding: 5px 10px; }
    }
  </style>
</head>
<body>
  <main class="container">

    <!-- 1) 인사 영역 -->
    <header class="hero">
      <p class="hello">안녕하세요 👋</p>
      <h1>나초보입니다</h1>
      <p class="intro">AI 애플리케이션 개발자를 준비하는 비전공자</p>
    </header>

    <!-- 2) 배우는 것 -->
    <section class="card" aria-labelledby="learn-title">
      <h2 id="learn-title">배우는 것</h2>

      <div class="group">
        <p class="group-title">지금 배우는 것</p>
        <ul class="tags now">
          <li>LLM 기초</li>
          <li>Claude 프롬프트 작성</li>
          <li>컨텍스트 엔지니어링</li>
        </ul>
      </div>

      <div class="group">
        <p class="group-title">앞으로 배울 것</p>
        <ul class="tags next">
          <li>Python</li>
          <li>Java</li>
          <li>Spring Boot</li>
          <li>SQL</li>
          <li>React</li>
          <li>Docker</li>
        </ul>
      </div>
    </section>

    <!-- 3) 목표 -->
    <section class="card goal" aria-labelledby="goal-title">
      <h2 id="goal-title">목표</h2>
      <p><strong>6개월 안에 첫 프로젝트를 배포</strong>하는 것이 목표입니다.</p>
      <p>데이터 처리와 자동화에 관심이 있어, 반복 작업을 줄여 주는 서비스를 만들어 보려 합니다.</p>
    </section>

    <!-- 4) 연락처 -->
    <section class="card" aria-labelledby="contact-title">
      <h2 id="contact-title">연락처</h2>
      <!-- ⚠️ 아래 your-github-id 를 본인 GitHub 아이디로 바꿔 주세요 -->
      <a class="github-link" href="https://github.com/your-github-id"
         target="_blank" rel="noopener noreferrer">
        <!-- GitHub 아이콘 (인라인 SVG, 외부 파일 없음) -->
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
          1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
          1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
          1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub 프로필 보기
      </a>
    </section>

    <footer>
      <p>© <span id="year"></span> 나초보</p>
    </footer>
  </main>

  <script>
    // 푸터 연도를 현재 연도로 자동 표시
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
